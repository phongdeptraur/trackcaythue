<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom // Live Node Tracker</title>
    <style>
        :root {
            --bg: #07090e;
            --surface: #0e131f;
            --border: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .dashboard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
        }

        .online { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .offline { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .metric-grid {
            display: grid;
            gap: 12px;
        }

        .metric-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
        }

        .progress-bar {
            height: 6px;
            background: #1e293b;
            border-radius: 999px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <div>
                <h2 style="font-size: 20px;">NODE MONITOR</h2>
                <span style="font-size: 12px; color: var(--text-muted);" id="last-seen">Polling GitHub...</span>
            </div>
            <div class="status-pill offline" id="status-badge">
                <span class="pulse"></span>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>

        <div class="metric-grid">
            <div class="metric-box">
                <div class="metric-label">Target PC Hostname</div>
                <div class="metric-value" id="hostname">--</div>
            </div>

            <div class="metric-box">
                <div class="metric-label">Active Foreground App</div>
                <div class="metric-value" style="color: var(--accent-cyan);" id="active-window">--</div>
            </div>

            <div class="metric-box">
                <div class="metric-label">Memory Allocation (RAM)</div>
                <div class="metric-value" id="ram-text">-- %</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="ram-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG: Thay bằng Username và Repo của bạn
        const GITHUB_USER = "YOUR_GITHUB_USERNAME";
        const GITHUB_REPO = "YOUR_REPO_NAME";
        const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/telemetry.json`;

        async function fetchTelemetry() {
            try {
                // Thêm timestamp để bypass cache CDN của GitHub
                const res = await fetch(`${DATA_URL}?_t=${Date.now()}`);
                if (!res.ok) throw new Error("Fetch failed");
                const data = await res.json();

                const now = Math.floor(Date.now() / 1000);
                const isOnline = (now - data.epoch) <= 20; // Nếu heartbeat < 20 giây trước -> Online

                // Update UI
                const badge = document.getElementById('status-badge');
                const badgeText = document.getElementById('status-text');
                badge.className = `status-pill ${isOnline ? 'online' : 'offline'}`;
                badgeText.textContent = isOnline ? 'LIVE' : 'DISCONNECTED';

                document.getElementById('hostname').textContent = `${data.system.hostname} (${data.system.os})`;
                document.getElementById('active-window').textContent = data.hardware.active_window;
                document.getElementById('ram-text').textContent = `${data.hardware.ram_usage_percent}%`;
                document.getElementById('ram-fill').style.width = `${data.hardware.ram_usage_percent}%`;
                document.getElementById('last-seen').textContent = `Sync: ${new Date(data.last_heartbeat).toLocaleTimeString()}`;
            } catch (err) {
                console.error("Link error:", err);
            }
        }

        // Tự động load mỗi 3 giây
        fetchTelemetry();
        setInterval(fetchTelemetry, 3000);
    </script>
</body>
</html>
