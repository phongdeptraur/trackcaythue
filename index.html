<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom // Live Terminal Dispatch</title>
    <style>
        :root {
            --bg: #07090e;
            --surface: #0e131f;
            --border: #1e293b;
            --green: #10b981;
            --red: #ef4444;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            max-width: 580px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 680px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
        }

        .online { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .offline { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 6px;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }

        .msg-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 10px;
            animation: fadeIn 0.2s ease;
        }

        .msg-time {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .msg-text {
            font-size: 14px;
            color: #fff;
            word-break: break-word;
            line-height: 1.4;
        }

        .empty-hint {
            margin: auto;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="chat-card">
        <div class="header">
            <div>
                <div class="title">TERMINAL STREAM</div>
                <div style="font-size: 11px; color: var(--muted);" id="sync-info">Polling API...</div>
            </div>
            <div class="status-pill offline" id="status-badge">
                <span class="pulse"></span>
                <span id="status-text">OFFLINE</span>
            </div>
        </div>

        <div class="chat-box" id="messageList">
            <div class="empty-hint">Chưa có tin nhắn nào được gửi từ Python...</div>
        </div>
    </div>

    <script>
        const GITHUB_USER = "phongdeptraur";
        const GITHUB_REPO = "trackcaythue";
        const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/chat.json`;

        let lastMessageCount = 0;

        // UTF-8 Safe Base64 Decoder
        function b64DecodeUnicode(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        async function pullChat() {
            try {
                // Fetch trực tiếp qua REST API để 0ms cache delay
                const res = await fetch(API_URL, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });

                if (res.status === 404) return;
                if (!res.ok) throw new Error("API error");

                const apiData = await res.json();
                const decodedJson = b64DecodeUnicode(apiData.content);
                const data = JSON.parse(decodedJson);

                // Update Online/Offline Status
                const badge = document.getElementById('status-badge');
                const badgeText = document.getElementById('status-text');
                const isOnline = data.status === "ONLINE";

                badge.className = `status-pill ${isOnline ? 'online' : 'offline'}`;
                badgeText.textContent = isOnline ? 'ONLINE' : 'OFFLINE';
                document.getElementById('sync-info').textContent = `Sync: ${new Date().toLocaleTimeString()}`;

                // Update Messages
                const box = document.getElementById('messageList');
                if (data.messages && data.messages.length > 0) {
                    if (data.messages.length !== lastMessageCount) {
                        box.innerHTML = '';
                        data.messages.forEach(m => {
                            const item = document.createElement('div');
                            item.className = 'msg-item';
                            item.innerHTML = `
                                <div class="msg-time">[${m.time}] Terminal Host</div>
                                <div class="msg-text">${m.text}</div>
                            `;
                            box.appendChild(item);
                        });
                        box.scrollTop = box.scrollHeight;
                        lastMessageCount = data.messages.length;
                    }
                }
            } catch (err) {
                console.error("Stream poll error:", err);
            }
        }

        pullChat();
        setInterval(pullChat, 1500); // Quét 1.5 giây một lần
    </script>
</body>
</html>
